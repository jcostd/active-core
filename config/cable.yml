# L'adapter async funziona solo nello stesso processo: per inviare aggiornamenti a mano
# e vederli nel browser usare la web console (dentro il processo di sviluppo),
# non bin/rails console! Aggiungere "console" in un'azione o in una vista ERB
# per far comparire la web console.
development:
  adapter: async

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
