# Nome dell'applicazione, identifica i container.
service: active-core

# Nome dell'immagine (utente/app sui registry esterni).
image: jcostd/active-core

# Server di destinazione.
servers:
  web:
    - activecore_qr

# Certificati SSL automatici con Let's Encrypt e più app sullo stesso server.
# Con Cloudflare impostare SSL/TLS su "Full".
#
# Richiede config.assume_ssl e config.force_ssl in production.rb!
#
# Non usarlo con più server web (SSL va terminato sul load balancer).
#
# proxy:
#   ssl: true
#   host: app.example.com

# Registry delle immagini.
registry:
  # Alternative: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: ghcr.io

  # Necessario per i registry con autenticazione.
  username: jcostd

  # Usare sempre un token invece della password reale.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Variabili d'ambiente nei container (i segreti arrivano da .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Solid Queue gira dentro Puma per eseguire i job.
    # Con più server spostare i job su una macchina dedicata.
    SOLID_QUEUE_IN_PUMA: true

    # Processi dedicati a Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Core disponibili all'app su ogni server (default: 1).
    # WEB_CONCURRENCY: 2

    # Indirizzo di un eventuale database esterno per Active Record.
    # active-core-db per un database accessorio sulla stessa macchina (rete docker di kamal).
    # DB_HOST: 192.168.0.2

    # Log completo di Rails
    # RAILS_LOG_LEVEL: debug

# Alias da usare con "bin/kamal <alias>"; gli argomenti si possono sovrascrivere:
# "bin/kamal logs -r job" segue i log del primo server job.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  feedbacks: app exec --reuse "bin/rails feedbacks:recent"

# Volume persistente per i database SQLite.
# Meglio un volume montato con backup fuori dal server.
volumes:
  - "/activecore-storage:/rails/storage"

# Mantiene gli asset (JS, CSS) di versione vecchia e nuova
# per evitare 404 sulle richieste in corso durante il deploy.
asset_path: /rails/public/assets


# Configurazione della build dell'immagine.
builder:
  arch: amd64

